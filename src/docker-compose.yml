services:
  app:
    build: .
    container_name: paylink
    ports:
      - "5000:5000"

  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: paylink-database
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data: